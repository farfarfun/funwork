[project]
name = "funwork"
version = "0.0.27"
description = "工作用零散脚本集合：批量查询微店商品信息、通过 HTTP 网关泛化调用有赞 Dubbo 服务、DataFrame 转 HTML 报表"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "demjson3>=3.0.6",
    "farlog>=1.1.7",
    "funsecret>=1.4.84",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=9.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funwork"]
